[pytest]
testpaths = tests core
norecursedirs = .git .venv venv work ripple/_testdata ripple_testdata
markers =
    live_llm: makes a real call to a configured LLM provider (cost + non-determinism). Not run by default. Run explicitly with `pytest -m live_llm`.
    wiring_debt: a module that is implemented and unit-tested but not yet driven from production. Red on purpose until the module is wired.
    seed_outdated: a reference-system test that asserts behaviour the business has already moved past. Green today, red once BR-001 changes. Seeded on purpose as TEST-OLD-001..003; the change-loop tests depend on them going red.
addopts = -m "not live_llm"
