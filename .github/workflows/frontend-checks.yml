# Frontend static checks: design-system guard, type check and the pure unit tests. No cloud, no AI provider, no secrets, no database, no browser.
# Manual trigger only (workflow_dispatch): nothing runs on push or pull request. Every step keeps its real exit code.
# Browser journeys (tests/ui_next) need an isolated PostgreSQL and run locally; they are NOT part of this job.
name: frontend-checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-types-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Design-system check
        run: npm run check:design
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
