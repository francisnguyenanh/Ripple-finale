server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  location / { try_files $uri $uri/ =404; }
}
